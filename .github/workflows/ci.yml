name: CI — Titanic Pipeline Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install scikit-learn pandas numpy matplotlib joblib pytest
      - run: pytest tests/ -v --tb=short
