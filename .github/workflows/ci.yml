name: CI — Titanic Pipeline Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Verify import
      run: |
        python -c "
        from titanic_model import engineer_features, build_pipeline, FEATURES
        print(f'Import OK — {len(FEATURES)} features defined')
        "

    - name: Run pytest suite
      run: |
        pytest tests/test_pipeline.py -v --tb=short

    - name: Coverage report
      run: |
        pytest tests/test_pipeline.py --cov=titanic_model --cov-report=term-missing -q
